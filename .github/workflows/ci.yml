name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: python -m pip install "poetry==2.2.1"

      - name: Validate project and lock file
        run: poetry check --lock --strict

      - name: Install dependencies
        run: |
          poetry install --extras dev --no-interaction

      - name: Lint with ruff
        run: poetry run ruff check .

      - name: Type check with mypy
        run: poetry run mypy packages apps pipelines --ignore-missing-imports || true

      - name: Run unit tests
        run: poetry run pytest tests/unit -v --ignore-glob="*load*" || true
